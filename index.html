*{box-sizing:border-box}html,body{margin:0;height:100%;background:#FBF8F3}
#app{position:fixed;inset:0;container:site/inline-size;transform:translateZ(0);overflow:hidden}
#app>.site{position:absolute;inset:0;overflow:hidden}
.dev-scroll{position:absolute;inset:0;overflow:auto;scroll-behavior:smooth;scroll-padding-top:76px;overscroll-behavior:contain}
.rvonly,.cap,.s-ts{display:none!important}.flag{outline:0!important}
#app .reelbox{position:relative;overflow:hidden;background:#181512}
.rl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease;transform:scale(1.02)}
.rl.on{opacity:1;animation:rpan 9s ease-out forwards}
@keyframes rpan{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.reelbox.paused .rl{animation-play-state:paused}
.rcap{position:absolute;left:0;right:0;bottom:0;padding:44px 22px 20px;background:linear-gradient(transparent,rgba(24,21,18,.82));color:#FBF8F3;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;z-index:2}
.rcap b{font:500 22px/1.15 var(--serif);letter-spacing:.01em}
.rdots{display:flex;gap:2px}.rdots button{width:44px;height:44px;background:none;border:0;cursor:pointer;position:relative}
.rdots button::after{content:"";position:absolute;left:8px;right:8px;top:21px;height:3px;background:rgba(251,248,243,.45)}
.rdots button[aria-pressed=true]::after{background:var(--brassb)}
.reelbox .pz{z-index:3}
@media (prefers-reduced-motion:reduce){.dev-scroll{scroll-behavior:auto}}
/* ===== PROPOSED CASARIO SITE (scoped .site; responds to its FRAME width via container queries) ===== */
.site{--ivory:#FBF8F3;--linen:#F3ECE0;--sand:#E6DEC8;--ink:#181512;--ink2:#231F1C;--umber:#5B5046;--brass:#7A5A1E;--brassb:#D4AF6A;--sage:#3A4A3E;--err:#B3261E;--ok:#2F6B3F;--focus:#7A5A1E;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--px:20px;font-family:var(--sans);color:var(--ink);background:var(--ivory);line-height:1.65;font-size:16px}
.site *,.site *::before,.site *::after{box-sizing:border-box}
.site :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.site .dk :focus-visible,.site .dk:focus-visible{--focus:#D4AF6A;outline-color:#D4AF6A}
.site h1,.site h2,.site h3,.site h4{font-family:var(--serif);font-weight:500;letter-spacing:-.012em;line-height:1.04;margin:0}
.site p{margin:0}
:where(.site) a{color:inherit}
.site img{max-width:100%}
.site button{cursor:pointer}
.s-wrap{max-width:1240px;margin-inline:auto;padding-inline:var(--px)}
.s-eyebrow{font:600 12px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.dk .s-eyebrow{color:var(--brassb)}
.s-h1{font-size:clamp(44px,13cqi,92px);line-height:.98;letter-spacing:-.025em}
.s-h2{font-size:clamp(34px,8.2cqi,58px)}
.s-h3{font-size:clamp(24px,5.4cqi,32px);line-height:1.1}
.s-lead{font-size:clamp(16px,2.2cqi,19px);color:var(--umber);max-width:56ch}
.dk .s-lead{color:#B9B1A5}
.s-sec{padding-block:clamp(56px,12cqi,112px)}
.s-sec.lin{background:var(--linen)}
.s-sec.dk{background:var(--ink);color:var(--ivory)}
.s-head{display:grid;gap:14px;margin-bottom:clamp(28px,5cqi,52px);max-width:760px}
/* buttons */
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:48px;padding:0 24px;font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--ivory);text-decoration:none;transition:background .2s,color .2s,border-color .2s;border-radius:2px;white-space:nowrap}
.s-btn:hover{background:var(--brass);border-color:var(--brass)}
.s-btn.gh{background:transparent;color:var(--ink)}
.s-btn.gh:hover{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.dk .s-btn{background:var(--brassb);border-color:var(--brassb);color:var(--ink)}
.dk .s-btn:hover{background:var(--ivory);border-color:var(--ivory)}
.dk .s-btn.gh{background:transparent;color:var(--ivory);border-color:#6d655a}
.dk .s-btn.gh:hover{background:var(--ivory);color:var(--ink)}
.s-btn[disabled]{opacity:.5;cursor:not-allowed}
.s-link{font:600 12px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-underline-offset:6px;text-decoration-thickness:1px;display:inline-flex;min-height:44px;align-items:center;gap:8px;background:none;border:0;padding:0}
.s-link:hover{color:var(--brass)}
.dk .s-link{color:var(--ivory)}.dk .s-link:hover{color:var(--brassb)}
.s-chip{min-height:44px;padding:0 18px;border:1px solid #B9AF9B;background:transparent;color:var(--ink);font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;border-radius:99px}
.s-chip[aria-pressed=true]{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.s-chip:hover{border-color:var(--ink)}
/* utility bar + header */
.s-util{background:var(--ink);color:#D9D2C6;font-size:12px;letter-spacing:.04em}
.s-util .s-wrap{display:flex;justify-content:space-between;gap:12px;min-height:36px;align-items:center}
.s-util a{text-underline-offset:3px;color:var(--brassb);font-weight:600}
.s-util .hide-m{display:none}
.s-header{position:sticky;top:0;z-index:30;background:rgba(251,248,243,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--sand)}
.s-header .s-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.s-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.s-logo i{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--brassb);display:grid;place-items:center;font:600 21px/1 var(--serif);font-style:normal}
.s-logo b{display:block;font:600 25px/1 var(--serif);letter-spacing:.2em}
.s-logo small{display:block;font-size:9.5px;letter-spacing:.26em;margin-top:3px;color:var(--umber);text-transform:uppercase}
.s-nav{display:none;gap:clamp(14px,2.2cqi,30px);align-items:center}
.s-nav a{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:14px 2px;border-bottom:1px solid transparent;color:var(--ink)}
.s-nav a:hover,.s-nav a[aria-current]{border-color:var(--brass);color:var(--brass)}
.s-hcta{display:none}
.s-menu{width:48px;height:48px;border:1px solid #B9AF9B;background:transparent;border-radius:2px;display:grid;place-items:center;color:var(--ink)}
.s-drawer{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--ivory);padding:18px var(--px) 28px;display:none;flex-direction:column;overflow:auto}
.s-drawer[data-open=true]{display:flex}
.s-drawer .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.s-drawer .s-logo{color:var(--ivory)}.s-drawer .s-logo small{color:#B9B1A5}
.s-drawer nav{display:grid}
.s-drawer nav a{font:500 38px/1.15 var(--serif);padding:12px 0;border-bottom:1px solid #3a342d;text-decoration:none;display:flex;justify-content:space-between;align-items:center}
.s-drawer .meta{margin-top:auto;padding-top:26px;display:grid;gap:12px;font-size:14px;color:#B9B1A5}
.s-drawer .s-btn{width:100%}
.s-x{width:48px;height:48px;border:1px solid #6d655a;background:none;color:var(--ivory);border-radius:2px;font-size:22px}
@container site (min-width:1000px){.s-nav{display:flex}.s-hcta{display:inline-flex}.s-menu{display:none}.s-util .hide-m{display:inline}.site{--px:56px}}
@container site (min-width:640px) and (max-width:999px){.s-hcta{display:inline-flex}.site{--px:36px}.s-util .hide-m{display:inline}}
/* hero */
.s-hero{display:grid;gap:30px;padding-block:28px 40px}
.s-hero .copy{display:grid;gap:24px;align-content:center}
.s-hero .acts{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.s-hero .loc{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--umber)}
.s-img{position:relative;background-color:var(--sand);background-size:cover;background-position:center;overflow:hidden}
.s-img.hero{min-height:380px;aspect-ratio:4/5}
.s-img .cap{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end;pointer-events:none}
.s-img .cap span{background:rgba(24,21,18,.82);color:#F3ECE0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;line-height:1.4}

const EST = {
  presets:{consult:{label:'Design consultation', sub:'Fixed fee', area:0}, b2:{label:'2 BHK home', sub:'≈ 1,150 sq.ft', area:1150}, b3:{label:'3 BHK home', sub:'≈ 1,650 sq.ft', area:1650}, vil:{label:'4 BHK / villa', sub:'≈ 2,600 sq.ft', area:2600}},

  scopes:[
    {k:'ply', label:'Plywood, laminates & wardrobes', base:523102, tier:true},
    {k:'carp', label:'Carpentry & factory fabrication', base:280473, tier:true},
    {k:'ceil', label:'False ceiling & cove lighting', base:42000, tier:true},
    {k:'hw', label:'Architectural hardware', base:27366, tier:true},
    {k:'ext', label:'Exterior / foyer elevation', base:93475, tier:true},
    {k:'hand', label:'Blinds & handover deep-clean', base:24500, tier:false}
  ],
  refArea:1650, gst:.18, band:.10, consultFee:8000
};
function calcEstimate(s){
  if(s.prop==='consult') return {consult:true, items:[{label:'Space plan, lighting blueprint & material boards', v:EST.consultFee/1.18}], sub:EST.consultFee/1.18, gst:EST.consultFee-EST.consultFee/1.18, total:EST.consultFee, lo:EST.consultFee, hi:EST.consultFee};
  const sc = s.area/EST.refArea, tm = EST.tiers[s.tier].m, items=[];
  EST.scopes.forEach(x=>{ if(s.scopes[x.k]) items.push({label:x.label, v:x.base*sc*(x.tier?tm:1)}); });
  if(!items.length) return {empty:true, items:[], sub:0, gst:0, total:0, lo:0, hi:0};
  const sub = items.reduce((a,b)=>a+b.v,0), gst = sub*EST.gst, total = sub+gst;
  return {items, sub, gst, total, lo:total*(1-EST.band), hi:total*(1+EST.band)};
}

    else if(a==='modal-sample'||a==='similar'){
      const title=a==='similar'?`Discuss a project like “${t.dataset.t}”`:'Request sample boards'; openModal(d,`<h3 class="s-h3" id="mt">${title}</h3><p class="s-hint" style="margin:8px 0 14px">Tell us a little about your space and we will get back to you.</p>${leadForm('m'+st.id, a==='similar'?`I’d like something similar to ${t.dataset.t}.`:'Please bring sample boards to my site.')}`, t); }

  d.addEventListener('input', e=>{
    const t=e.target, st=d._st;

function drawEstKeep(d){ const st=d._st, r=$(d,'[data-part=estres]'); r.innerHTML=estResult(st.est); $(d,'[data-out=area]').textContent=st.est.area.toLocaleString('en-IN')+' sq.ft'; }


const REEL=[['living','Living sanctuary'],['kitchen','Walnut & cashmere kitchen'],['bed','Fluted oak master suite'],['board','Material & space planning']];
function initReel(d){ if(d._rt) clearInterval(d._rt); const h=d.querySelector('[data-part=hero].reelbox'); if(!h) return; let i=0; const L=[...h.querySelectorAll('.rl')], D=[...h.querySelectorAll('[data-reel]')], T=h.querySelector('[data-reel-t]');
  const show=n=>{ i=(n+L.length)%L.length; L.forEach((l,k)=>l.classList.toggle('on',k===i)); D.forEach((b,k)=>b.setAttribute('aria-pressed',k===i)); T.textContent=REEL[i][1]; };
  h.addEventListener('click',e=>{ const b=e.target.closest('[data-reel]'); if(b) show(+b.dataset.reel); });
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches; if(!rm) d._rt=setInterval(()=>{ if(!h.classList.contains('paused')&&document.visibilityState==='visible') show(i+1); },6500); else h.classList.add('paused'); }
const _ms=mountSite; mountSite=function(d,p,o){ const r=_ms(d,p,o); initReel(d); return r; };
